questions:
  - id: M01
    type: T4
    question: "What happens when I call a method on a mapper interface obtained from SqlSession.getMapper?"
    key_points:
      - "getMapper goes through Configuration and MapperRegistry to a MapperProxyFactory"
      - "MapperProxyFactory creates a JDK dynamic proxy (Proxy.newProxyInstance) with MapperProxy as handler"
      - "MapperProxy.invoke finds a cached MapperMethodInvoker for the method"
      - "MapperMethod.execute dispatches on the SQL command type (INSERT, UPDATE, DELETE, SELECT, FLUSH) to SqlSession methods"
      - "SqlSession calls the Executor"
    required_evidence:
      - {kind: code, location: "M/session/defaults/DefaultSqlSession.java#L285"}
      - {kind: code, location: "M/binding/MapperRegistry.java#L44"}
      - {kind: code, location: "M/binding/MapperProxyFactory.java#L47"}
      - {kind: code, location: "M/binding/MapperProxy.java#L59-L70"}
      - {kind: code, location: "M/binding/MapperMethod.java#L57-L75"}
    expect_not_found: false
    must_not_say: ["bytecode generation is used for mapper proxies"]
    difficulty: hard

  - id: M02
    type: T2
    question: "Which executor types exist and how is one chosen?"
    key_points:
      - "ExecutorType SIMPLE, REUSE, BATCH; default SIMPLE (defaultExecutorType)"
      - "Configuration.newExecutor creates BatchExecutor, ReuseExecutor or SimpleExecutor"
      - "If cacheEnabled (default true) it wraps the executor in CachingExecutor"
      - "Finally interceptorChain.pluginAll wraps it with plugins"
    required_evidence:
      - {kind: code, location: "M/session/ExecutorType.java#L21-L23"}
      - {kind: code, location: "M/session/Configuration.java#L132"}
      - {kind: code, location: "M/session/Configuration.java#L735-L748"}
      - {kind: code, location: "M/session/Configuration.java#L113"}
    expect_not_found: false
    must_not_say: []
    difficulty: medium

  - id: M03
    type: T2
    question: "How does MyBatis's second-level cache wrap the executor?"
    key_points:
      - "CachingExecutor is a decorator holding a delegate Executor"
      - "It uses a TransactionalCacheManager so cache writes are committed or rolled back with the session"
      - "It is applied when cacheEnabled is true (the default)"
    required_evidence:
      - {kind: code, location: "M/executor/CachingExecutor.java#L41-L46"}
      - {kind: code, location: "M/executor/CachingExecutor.java#L59-L61"}
      - {kind: code, location: "M/session/Configuration.java#L745-L746"}
    expect_not_found: false
    must_not_say: []
    difficulty: medium

  - id: M04
    type: T4
    question: "How does the first-level (local) cache work, and how can I limit it to one statement?"
    key_points:
      - "BaseExecutor keeps a PerpetualCache named LocalCache per session"
      - "Queries read from it; updates, commits and rollbacks clear it"
      - "localCacheScope defaults to SESSION; with STATEMENT the cache is cleared after each query"
    required_evidence:
      - {kind: code, location: "M/executor/BaseExecutor.java#L59"}
      - {kind: code, location: "M/executor/BaseExecutor.java#L69"}
      - {kind: code, location: "M/executor/BaseExecutor.java#L170-L172"}
      - {kind: code, location: "M/session/Configuration.java#L125"}
      - {kind: code, location: "M/session/LocalCacheScope.java#L22"}
    expect_not_found: false
    must_not_say: []
    difficulty: medium

  - id: M05
    type: T6
    question: "How do I write a plugin that intercepts executor calls, and which objects can plugins wrap?"
    key_points:
      - "Implement Interceptor (intercept(Invocation); plugin and setProperties have defaults)"
      - "Declare targets with @Intercepts and @Signature(type, method, args)"
      - "Plugin.wrap builds a JDK proxy for targets whose interfaces match the signature map; it fails without @Intercepts"
      - "InterceptorChain.pluginAll is applied to Executor, ParameterHandler, ResultSetHandler and StatementHandler"
    required_evidence:
      - {kind: code, location: "M/plugin/Interceptor.java#L25-L31"}
      - {kind: code, location: "M/plugin/Plugin.java#L43-L48"}
      - {kind: code, location: "M/plugin/Plugin.java#L66-L71"}
      - {kind: code, location: "M/plugin/InterceptorChain.java#L28"}
      - {kind: code, location: "M/session/Configuration.java#L714-L728"}
      - {kind: code, location: "M/session/Configuration.java#L748"}
    expect_not_found: false
    must_not_say: []
    difficulty: hard

