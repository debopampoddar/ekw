  - id: M07
    type: T10
    question: "Does MyBatis include a Redis or other distributed cache implementation?"
    key_points:
      - "No: all cache implementations in the repository are in-process (PerpetualCache plus decorators)"
      - "Near miss: BlockingCache's Javadoc mentions EhCache only as the design it imitates"
      - "Distributed caches can be plugged in through the Cache interface, but none is included here"
    required_evidence:
      - {kind: code, location: "M/cache/decorators/BlockingCache.java#L29"}
      - {kind: code, location: "M/cache/impl/PerpetualCache.java#L27"}
    expect_not_found: true
    must_not_say: ["RedisCache is included"]
    difficulty: medium

