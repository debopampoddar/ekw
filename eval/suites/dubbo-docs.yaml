  - id: W05
    type: T3
    question: "Why did Dubbo 3 introduce application-level service discovery?"
    key_points:
      - "Interface-level registration makes registry data grow with every interface: redundant address data"
      - "Goal: cut resource use of service discovery (registry capacity, consumer address parsing) to scale horizontally"
      - "Goal: fit infrastructure discovery models such as Kubernetes and service mesh"
      - "In code: ServiceDiscoveryRegistry and the register-mode setting (interface, instance, all)"
    required_evidence:
      - {kind: doc, location: "doc:W/reference/proposals/service-discovery.md#L15-L18"}
      - {kind: doc, location: "doc:W/reference/proposals/service-discovery.md#L63-L72"}
      - {kind: code, location: "dubbo/dubbo-registry/dubbo-registry-api/src/main/java/org/apache/dubbo/registry/client/ServiceDiscoveryRegistry.java#L75"}
      - {kind: code, location: "C/constants/RegistryConstants.java#L63-L75"}
    expect_not_found: false
    must_not_say: []
    difficulty: medium

  - id: W06
    type: T10
    question: "Can I enable adaptive flow control by setting flowcontrol to heuristicSmoothingFlowControl in this Dubbo code?"
    key_points:
      - "The proposal describes it (flowcontrol = autoConcurrencyLimier or heuristicSmoothingFlowControl)"
      - "Not found in this repository at commit a87b134: no such classes or settings in the code"
      - "Near miss: Triple's HTTP/2 flow controllers are a different mechanism"
      - "The answer flags a document-code disagreement and does not claim the feature works here"
    required_evidence:
      - {kind: doc, location: "doc:W/reference/proposals/heuristic-flow-control.md#L103-L125"}
      - {kind: code, location: "dubbo/dubbo-rpc/dubbo-rpc-triple/src/main/java/org/apache/dubbo/rpc/protocol/tri/TripleHttp2Protocol.java#L131"}
    expect_not_found: true
    must_not_say: ["set flowcontrol=heuristicSmoothingFlowControl and it works"]
    difficulty: hard

  - id: W07
    type: T9
    question: "The flow-control proposal says to set loadbalance to p2c or adaptive. Are both available?"
    key_points:
      - "adaptive: yes (AdaptiveLoadBalance, registered as 'adaptive')"
      - "p2c: no P2C load balancer is registered or implemented in this repository"
      - "Beware: a text search for 'p2c' matches 'Http2Connection' in unrelated code"
    required_evidence:
