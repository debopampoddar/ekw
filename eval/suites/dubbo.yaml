  - id: D03
    type: T4
    question: "How does failover retry work, and how many times is a call attempted by default?"
    key_points:
      - "failover is the default cluster strategy"
      - "FailoverClusterInvoker computes invoke times as the retries parameter + 1, so 3 attempts by default (DEFAULT_RETRIES = 2)"
      - "A retries value in the RPC context attachment overrides the URL parameter for that call"
      - "It loops over attempts, selecting an invoker each time"
    required_evidence:
      - { kind: code, location: "K/Cluster.java#L34-L37" }
      - { kind: code, location: "K/support/FailoverClusterInvoker.java#L63-L68" }
      - { kind: code, location: "K/support/FailoverClusterInvoker.java#L129-L135" }
      - { kind: code, location: "C/constants/CommonConstants.java#L415-L419" }
    expect_not_found: false
    must_not_say: [ "retries default is 3" ]
    difficulty: medium

