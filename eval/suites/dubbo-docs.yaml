questions:
  - id: W01
    type: T8
    question: "Our provider logs show Dubbo error 0-1. What is happening and what should I change?"
    key_points:
      - "Thread pool exhausted: the provider's business threads are all busy and new requests are rejected"
      - "Default is 200 threads (the runbook says so and the code's DEFAULT_THREADS is 200)"
      - "Causes: consumer concurrency too high, or provider threads blocked on external calls"
      - "Steps: check the access log, inspect threads with jps/jstack, raise dubbo.provider.threads, or add provider servers"
      - "In code, AbortPolicyWithReport logs 0-1 when the pool rejects a task"
    required_evidence:
      - {kind: doc, location: "doc:F/0/1.md#L14-L25"}
      - {kind: code, location: "C/constants/CommonConstants.java#L111"}
      - {kind: code, location: "C/threadpool/support/AbortPolicyWithReport.java#L123"}
    expect_not_found: false
    must_not_say: []
    difficulty: medium

  - id: W02
    type: T9
    question: "Does the 0-1 runbook's default thread count still match the code?"
    key_points:
      - "Yes: both say 200 (DEFAULT_THREADS = 200, read through the 'threads' key by FixedThreadPool)"
      - "A correct answer reports agreement and does not invent a discrepancy"
    required_evidence:
      - {kind: doc, location: "doc:F/0/1.md#L15"}
      - {kind: code, location: "C/constants/CommonConstants.java#L111"}
      - {kind: code, location: "C/threadpool/support/fixed/FixedThreadPool.java#L55"}
    expect_not_found: false
    must_not_say: ["does not match", "differs"]
    difficulty: medium

  - id: W03
    type: T8
    question: "What does error 5-1 mean, and is it about the configuration center or the registry?"
    key_points:
      - "The runbook calls it a configuration-center connection failure (center down, wrong address or port, firewall) with matching steps"
      - "In code the constant is CONFIG_FAILED_CONNECT_REGISTRY = \"5-1\" (config module), a name that suggests the registry"
      - "It is logged by the Apollo and ZooKeeper dynamic-configuration (configuration center) implementations, and by the Curator5 ZooKeeper client, which registries also use"
      - "So the runbook fits the configuration-center sites; the constant's name is misleading"
    required_evidence:
      - {kind: doc, location: "doc:F/5/1.md#L8-L27"}
      - {kind: code, location: "C/constants/LoggerCodeConstants.java#L302"}
      - {kind: code, location: "dubbo/dubbo-configcenter/dubbo-configcenter-apollo/src/main/java/org/apache/dubbo/configcenter/support/apollo/ApolloDynamicConfiguration.java#L127"}
      - {kind: code, location: "dubbo/dubbo-configcenter/dubbo-configcenter-zookeeper/src/main/java/org/apache/dubbo/configcenter/support/zookeeper/ZookeeperDynamicConfiguration.java#L79"}
      - {kind: code, location: "dubbo/dubbo-remoting/dubbo-remoting-zookeeper-curator5/src/main/java/org/apache/dubbo/remoting/zookeeper/curator5/Curator5ZookeeperClient.java#L109"}
    expect_not_found: false
    must_not_say: []
    difficulty: hard

