  - id: A07
    type: T4
    question: "What exactly does fail-fast do?"
    key_points:
      - "With failFast, handleFailure rethrows the error as a CompletionException"
      - "The first error is passed to the global failure handler"
      - "The first failure sets the failure flag, cancels all futures and calls shutdownNow on the executor"
      - "Tasks that start afterwards see the flag and throw CancellationException"
      - "cancel(true) on a CompletableFuture does not interrupt running work; shutdownNow is what interrupts threads"
    required_evidence:
      - { kind: code, location: "P/TaskExecutor.java#L135-L151" }
      - { kind: code, location: "P/TaskExecutor.java#L215-L218" }
      - { kind: code, location: "P/TaskExecutor.java#L254-L256" }
      - { kind: code, location: "P/TaskExecutor.java#L264-L270" }
