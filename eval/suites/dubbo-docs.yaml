      - {kind: code, location: "dubbo/dubbo-cluster/src/main/resources/META-INF/dubbo/internal/org.apache.dubbo.rpc.cluster.LoadBalance#L1-L6"}
      - {kind: code, location: "dubbo/dubbo-cluster/src/main/java/org/apache/dubbo/rpc/cluster/loadbalance/AdaptiveLoadBalance.java#L36"}
    expect_not_found: false
    must_not_say: ["p2c is available"]
    difficulty: hard

  - id: W08
    type: T3
    question: "What problems with the older load balancers motivated the adaptive load balancer?"
    key_points:
      - "ShortestResponse often degrades to random because response times differ little, and response time is not throughput capacity"
      - "LeastActive's active-connection count also fails to reflect capacity"
      - "Hence a fairness-based P2C algorithm and an adaptive algorithm that estimates provider throughput"
    required_evidence:
      - {kind: doc, location: "doc:W/reference/proposals/heuristic-flow-control.md#L22-L30"}
    expect_not_found: false
    must_not_say: []
    difficulty: medium

