  - id: A04
    type: T4
    question: "Walk me through what happens when execute() runs several tasks with dependencies."
    key_points:
      - "validateDependencies then validateNoCycles run first"
      - "Only a single task without dependencies runs synchronously; otherwise executeAsynchronously"
      - "A virtual-thread-per-task executor is created"
      - "Tasks are visited in topological order (Kahn's algorithm) so dependency futures exist first"
      - "buildTaskFuture chains allOf(dependency futures) -> checkDependencies -> executeTask"
      - "executeTask runs the task's retry policy, records the result and calls onSuccess"
      - "All futures are joined; the global success handler runs if no fail-fast failure occurred; the executor is shut down"
